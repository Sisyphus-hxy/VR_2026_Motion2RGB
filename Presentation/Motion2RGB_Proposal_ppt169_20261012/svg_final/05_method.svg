<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="zh-CN" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" data-pptx-page-role="content">
  <defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#123D64" /></marker><marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><polygon points="0,0 10,5 0,10" fill="#0089AA" /></marker></defs>
  <rect id="page-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="page-title" data-pptx-bounds="48 35 1184 112"><text x="48" y="89" font-size="40" fill="#123D64" font-weight="bold">技术方法</text><text x="50" y="128" font-size="22" fill="#576772">Technical Method   /   Gait phase + depth reprojection</text></g>
  <g id="gait-method" data-pptx-bounds="48 173 530 299"><text x="48" y="207" font-size="30" fill="#123D64" font-weight="bold">01  共享步态时钟</text><g id="gait-clock" data-pptx-replace-with="formula" data-pptx-x="48" data-pptx-y="230" data-pptx-width="520" data-pptx-height="67" data-pptx-bounds="48 230 520 67"><metadata type="application/json">{"latex":"f=\\frac{v}{L},\\quad \\phi_{t+1}=\\phi_t+\\pi f\\Delta t","display":"block","font_size":28,"color":"#123D64","align":"left"}</metadata><text x="48" y="272.88" font-size="28" fill="#123D64">f = v / L,   φ(t+1) = φ(t) + π f Δt</text></g><g id="gait-offset" data-pptx-replace-with="formula" data-pptx-x="48" data-pptx-y="307" data-pptx-width="520" data-pptx-height="54" data-pptx-bounds="48 307 520 54"><metadata type="application/json">{"latex":"x=A_x\\cos\\phi,\\quad y=-A_y\\cos(2\\phi)","display":"block","font_size":28,"color":"#123D64","align":"left"}</metadata><text x="48" y="341.56" font-size="28" fill="#123D64">x = Aₓ cos φ,   y = −Aᵧ cos(2φ)</text></g><text fill="#576772" font-size="22" x="48" y="403">f 为每秒步数，左右周期为两步</text><text fill="#576772" font-size="22" x="48" y="439">pitch / roll 同相位并指数平滑</text></g><g id="reprojection-method" data-pptx-bounds="652 173 580 306"><text x="652" y="207" font-size="30" fill="#0089AA" font-weight="bold">02  深度重投影与采样</text><g id="blur-vector" data-pptx-replace-with="formula" data-pptx-x="652" data-pptx-y="235" data-pptx-width="575" data-pptx-height="78" data-pptx-bounds="652 235 575 78"><metadata type="application/json">{"latex":"\\mathbf{d}=(\\mathbf{u}-\\mathbf{u}_{prev})\\frac{T(E)IG}{\\Delta t}","display":"block","font_size":30,"color":"#123D64","align":"left"}</metadata><text x="652" y="284.92" font-size="30" fill="#123D64">d = (u − u_prev) · T(E) I G / Δt</text></g><text fill="#222C35" font-size="22" x="652" y="357">深度 + 当前 / 历史 VP 得到 u_prev</text><text fill="#222C35" font-size="22" x="652" y="393">沿轨迹追加 20 个样本，深度差降权</text><text fill="#222C35" font-size="22" x="652" y="429">归一化采样权重，保留常量亮度</text><text x="652" y="466" font-size="22" fill="#576772">T(E)：曝光代理映射；I：强度；G：运动增益</text></g><g id="shader-pipeline" data-pptx-bounds="48 488 1184 87"><rect x="48" y="488" width="1184" height="87" fill="#F2F5F7" stroke="none" /><text x="71" y="521" font-size="22" fill="#123D64" font-weight="bold">RGB + Depth</text><line x1="260" y1="533" x2="300" y2="533" stroke="#0089AA" stroke-width="2.5" marker-end="url(#arrow-cyan)" /><text x="322" y="542" font-size="28" fill="#222C35">位姿重投影</text><line x1="520" y1="533" x2="560" y2="533" stroke="#0089AA" stroke-width="2.5" marker-end="url(#arrow-cyan)" /><text x="583" y="542" font-size="28" fill="#222C35">Shader 加权采样</text><line x1="855" y1="533" x2="897" y2="533" stroke="#0089AA" stroke-width="2.5" marker-end="url(#arrow-cyan)" /><text x="922" y="542" font-size="28" fill="#0089AA" font-weight="bold">Degraded RT</text></g><g id="heuristic-boundary" data-pptx-bounds="48 594 1184 68"><text x="48" y="620" font-size="22" fill="#576772">Heuristic approximation：运动增益与深度距离截断均为艺术参数</text><text x="48" y="655" font-size="22" fill="#576772">Exposure Proxy 未经实机标定，当前模型不等价于完整物理曝光积分。</text></g>
  <g id="page-footer" data-pptx-bounds="48 679 1184 29" data-pptx-role="footer"><line x1="48" y1="680" x2="1232" y2="680" stroke="#D6DFE5" stroke-width="1.5" /><text x="48" y="703" font-size="14" fill="#576772">Motion2RGB   /   VR 课程开题   /   2026.10.15</text><text x="1232" y="703" font-size="14" fill="#576772" text-anchor="end">05 / 07</text></g>
  </svg>